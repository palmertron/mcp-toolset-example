[project]
name = "mcp-toolset-example"
version = "0.1.0"
description = "E2E demo of MCP Toolset Versioning: Streamable HTTP server + CLI agent pin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp",
    "openai>=1.0.0",
]

[tool.uv.sources]
mcp = { path = "../python-sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "client"]
